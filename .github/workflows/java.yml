name: Java

on:
  push:
    paths:
      - "**.java"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "**.java"
      - ".github/workflows/java.yml"
  workflow_dispatch:

env:
  PROCESSING_VERSION: 4.5.7

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Processing core.jar
        run: |
          mkdir -p lib
          curl -fsSL -o lib/core.jar \
            "https://repo1.maven.org/maven2/org/processing/core/${PROCESSING_VERSION}/core-${PROCESSING_VERSION}.jar"

      - name: Compile
        run: javac -Xlint:all -cp lib/core.jar -d out src/*.java
